[project]
name = "slmpt"
version = "0.1.0"
description = "Post-training experiments on a small language model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "trl==1.16.0",
    "peft==0.21.2",
    "datasets==5.1.0",
    "accelerate==1.15.0",
    "huggingface-hub==2.2.0",
    "lm-eval==0.4.13",
    "wandb==0.31.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# 4-bit / 8-bit quantization (QLoRA). CUDA-only, so it is kept out of the core install.
quant = ["bitsandbytes==0.50.2; sys_platform == 'linux'"]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slmpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
